# Real fine-tuning run config, used after fixing the label-shift bug in
# finetuning/dataset.py (see that file's __getitem__ and the commit that
# introduced the fix). Every fine-tuning attempt before that fix trained on
# a trivial identity/copy task instead of next-token prediction, so the
# earlier max_lr=5e-6 in this file was chasing a phantom "gradient shock"
# theory — the real problem was never the learning rate. Back to a normal
# fine-tuning LR now that the training signal itself is correct.
#
# Keeps a checkpoint every 3 epochs, retaining the last 15, so several
# points across the run can be compared for actual generation quality
# instead of trusting val_loss alone (see scripts/compare_finetune_checkpoints.py).
epochs: 40
batch_size: 4
max_lr: 3.0e-5
min_lr: 3.0e-6
warmup_ratio: 0.05
weight_decay: 0.01
betas: [0.9, 0.95]
grad_clip: 1.0
val_fraction: 0.12
log_interval: 20
out_dir: checkpoints/finetune_real
device: cpu
seed: 1337
keep_last_n_checkpoints: 15
checkpoint_every_n_epochs: 3
