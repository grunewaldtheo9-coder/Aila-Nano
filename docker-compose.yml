services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      AILA_CORS_ORIGINS: "http://localhost:3000"
      AILA_DEVICE: "cpu"
    volumes:
      - ./checkpoints:/app/checkpoints
      - ./tokenizer/artifacts:/app/tokenizer/artifacts
      - ./memory/data:/app/memory/data
      - ./vectordb/index:/app/vectordb/index

  frontend:
    build:
      context: ./web/frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:8000"
    depends_on:
      - backend
