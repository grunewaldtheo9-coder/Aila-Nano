[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aila-nano"
version = "0.2.0"
description = "Aila Nano — a from-scratch ~10.9M parameter decoder-only language model, built and owned by Aila Company Solutions. Terminal-first."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Theo Grunewald Hames" },
    { name = "Guilherme Grunewald Benkendorf" },
]
keywords = ["language-model", "transformer", "pytorch", "slm", "nlp", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Environment :: Console",
]

# Aila Nano is intentionally organized as a set of top-level, independently
# importable packages (tokenizer/, model/, training/, ...) rather than a
# single nested package. This mirrors the project's module boundaries 1:1
# and keeps `import model`, `import tokenizer`, etc. working from the repo
# root without extra indirection. `engine/` is the interface-independent AI
# core; `chat.py` at the repo root is the (current) terminal interface to it.
[tool.setuptools]
packages = [
    "tokenizer",
    "model",
    "training",
    "finetuning",
    "memory",
    "vectordb",
    "agents",
    "engine",
    "tools",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# A pragmatic, non-exhaustive rule set: correctness (F, E9), style (E4/E7),
# import hygiene (I), and modern-Python upgrades (UP).
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
