name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.6"
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Run tests
        run: pytest tests/ -v --cov=. --cov-report=term-missing

      - name: Verify model parameter budget
        run: python scripts/count_params.py

      - name: Verify chat.py imports and starts cleanly
        run: python -c "import chat; print('chat.py imports OK')"
